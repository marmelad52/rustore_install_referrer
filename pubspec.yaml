name: rustore_install_referrer
description: Flutter plugin for RuStore install referrer API. Track app installations and measure marketing campaign effectiveness.
version: 2.1.0
homepage: https://github.com/marmelad52/rustore_install_referrer
repository: https://github.com/marmelad52/rustore_install_referrer
issue_tracker: https://github.com/marmelad52/rustore_install_referrer/issues
documentation: https://github.com/marmelad52/rustore_install_referrer#readme

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.marmelad52.rustore_install_referrer
        pluginClass: RustoreInstallReferrerPlugin